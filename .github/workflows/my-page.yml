name: Fetch my page memes

# Downloads the Drive files listed in my_page/drive_ids.txt (the folder must be shared as
# "Anyone with the link can view"), transcribes the videos, and commits both to my_page/.
on:
  push:
    branches: [claude/pensive-newton-1m0wgi]
    paths: [my_page/drive_ids.txt, .github/workflows/my-page.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: my-page
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts
            my_page
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install gdown faster-whisper==1.1.1 "av<14" requests
      - name: List the shared Drive folder
        env:
          FOLDER_ID: 1WL2MuyrTDgWPLZL_W5RFyVEXR7ZEVcvH
        run: |
          python3 - <<'PY'
          import html, os, re, requests
          url = f"https://drive.google.com/embeddedfolderview?id={os.environ['FOLDER_ID']}"
          page = requests.get(url, timeout=60).text
          entries = re.findall(r'href="https://drive\.google\.com/file/d/([^/"]+)/view[^"]*".*?flip-entry-title">([^<]+)<', page, re.S)
          keep = {".mp4", ".jpg", ".jpeg", ".png", ".webp", ".gif", ".mov"}
          path = "my_page/drive_ids.txt"
          lines = open(path, encoding="utf-8").read().splitlines()
          known = {l.split("\t")[0] for l in lines if l and not l.startswith("#")}
          added = 0
          for fid, name in entries:
              name = html.unescape(name).strip()
              if fid in known or os.path.splitext(name)[1].lower() not in keep or name == "profile_pic.jpg":
                  continue
              lines.append(f"{fid}\t{name}")
              known.add(fid)
              added += 1
          open(path, "w", encoding="utf-8").write("\n".join(lines) + "\n")
          print(f"folder entries: {len(entries)}, added: {added}, total listed: {len(known)}")
          PY
      - name: Download from Drive
        run: |
          mkdir -p my_page/media
          failed=0
          while IFS=$'\t' read -r id name; do
            case "$id" in ''|\#*) continue ;; esac
            [ -s "my_page/media/$name" ] && continue
            gdown --quiet "$id" -O "my_page/media/$name" 2>/dev/null \
              || curl -sSfL --retry 2 -o "my_page/media/$name" "https://drive.usercontent.google.com/download?id=$id&export=download&confirm=t" \
              || { rm -f "my_page/media/$name"; echo "FAILED: $name ($id)"; failed=$((failed+1)); }
            # Drive returns an HTML page instead of the file when it rate-limits; drop those
            if [ -f "my_page/media/$name" ] && head -c 200 "my_page/media/$name" | grep -qi '<html'; then
              rm -f "my_page/media/$name"; echo "FAILED (html): $name"; failed=$((failed+1))
            fi
            sleep 3
          done < my_page/drive_ids.txt
          echo "failed downloads: $failed"
          ls my_page/media | wc -l
          [ "$(ls my_page/media | wc -l)" -gt 0 ]
      - name: Transcribe videos
        run: |
          if ls my_page/media/*.mp4 >/dev/null 2>&1; then
            SKIP_JSON=my_page/transcripts.json python scripts/transcribe.py my_page/media my_page/new_transcripts.json 0 1
            python3 - <<'PY'
          import json, os
          path = "my_page/transcripts.json"
          old = json.load(open(path, encoding="utf-8")) if os.path.exists(path) else {}
          old.update(json.load(open("my_page/new_transcripts.json", encoding="utf-8")))
          json.dump(dict(sorted(old.items())), open(path, "w", encoding="utf-8"), ensure_ascii=False, indent=1)
          os.remove("my_page/new_transcripts.json")
          PY
          fi
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add my_page
          git diff --cached --quiet && exit 0
          git commit -m "Add my page memes from Drive"
          git pull --rebase
          git push
