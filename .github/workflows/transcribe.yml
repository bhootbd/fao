name: Transcribe videos

on:
  push:
    branches: [claude/pensive-newton-1m0wgi]
    paths: [scripts/transcribe.py, .github/workflows/transcribe.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts
            archive/Meme_Template_bd/media
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install faster-whisper==1.1.1 requests
      - run: python scripts/transcribe.py archive/Meme_Template_bd/media transcripts_${{ matrix.shard }}.json ${{ matrix.shard }} 8
      - uses: actions/upload-artifact@v4
        with:
          name: transcripts-${{ matrix.shard }}
          path: transcripts_${{ matrix.shard }}.json

  merge:
    needs: transcribe
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - uses: actions/download-artifact@v4
        with:
          pattern: transcripts-*
          merge-multiple: true
      - name: Merge and commit
        run: |
          mkdir -p archive/Meme_Template_bd
          python3 - <<'PY'
          import glob, json
          merged = {}
          for f in sorted(glob.glob("transcripts_*.json")):
              merged.update(json.load(open(f, encoding="utf-8")))
          with open("archive/Meme_Template_bd/transcripts.json", "w", encoding="utf-8") as f:
              json.dump(dict(sorted(merged.items())), f, ensure_ascii=False, indent=1)
          print(len(merged), "transcripts")
          if not merged:
              raise SystemExit("no transcripts produced")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git sparse-checkout add archive/Meme_Template_bd/transcripts.json 2>/dev/null || true
          git add -f archive/Meme_Template_bd/transcripts.json
          git commit -m "Add video transcripts"
          git pull --rebase
          git push
